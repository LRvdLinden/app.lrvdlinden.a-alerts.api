name: Controle collectors (alleen lezen)
on:
  push:
    branches: [main]
    paths: ["tools/collectors_check.py", ".github/workflows/collectors-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Tel records per bron via de beveiligde docs-viewer
        env:
          AALERTS_DOCS_USERNAME: ${{ secrets.AALERTS_DOCS_USERNAME }}
          AALERTS_DOCS_PASSWORD: ${{ secrets.AALERTS_DOCS_PASSWORD }}
        run: python3 tools/collectors_check.py
