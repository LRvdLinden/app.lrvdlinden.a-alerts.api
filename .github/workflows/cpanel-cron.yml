name: Configure API source cron jobs
on:
  push:
    branches: [main]
    paths: ["tools/cpanel_setup_cron.py", ".github/workflows/cpanel-cron.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aalerts-cpanel-cron
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated cron schedules using cPanel API 2
        env:
          VIMEXX_CPANEL_USERNAME: ${{ secrets.VIMEXX_CPANEL_USERNAME }}
          VIMEXX_CPANEL_API_TOKEN: ${{ secrets.VIMEXX_CPANEL_API_TOKEN }}
        run: python3 tools/cpanel_setup_cron.py
