name: cPanel inventarisatie (geen wijzigingen)
on:
  push:
    branches: [main]
    paths: ["tools/cpanel_discover.py", ".github/workflows/cpanel-discover.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Controleer database en documentroot zonder wijzigingen
        env:
          VIMEXX_CPANEL_API_TOKEN: ${{ secrets.VIMEXX_CPANEL_API_TOKEN }}
          VIMEXX_CPANEL_USERNAME: ${{ secrets.VIMEXX_CPANEL_USERNAME }}
        run: python3 tools/cpanel_discover.py
