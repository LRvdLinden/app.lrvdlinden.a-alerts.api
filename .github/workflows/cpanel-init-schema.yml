name: A-Alerts MySQL tabellen initialiseren
on:
  push:
    branches: [main]
    paths: ["tools/cpanel_init_schema.py", ".github/workflows/cpanel-init-schema.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Installeer tabellen via beveiligde eenmalige endpoint
        env:
          VIMEXX_CPANEL_API_TOKEN: ${{ secrets.VIMEXX_CPANEL_API_TOKEN }}
          VIMEXX_CPANEL_USERNAME: ${{ secrets.VIMEXX_CPANEL_USERNAME }}
        run: python3 tools/cpanel_init_schema.py
