name: A-Alerts database aanmaken (alleen eigen API)
on:
  push:
    branches: [main]
    paths: ["tools/cpanel_provision_database.py", ".github/workflows/cpanel-provision-db.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpanel-aalerts-database
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Maak A-Alerts database en private config aan
        env:
          VIMEXX_CPANEL_API_TOKEN: ${{ secrets.VIMEXX_CPANEL_API_TOKEN }}
          VIMEXX_CPANEL_USERNAME: ${{ secrets.VIMEXX_CPANEL_USERNAME }}
        run: python3 tools/cpanel_provision_database.py
