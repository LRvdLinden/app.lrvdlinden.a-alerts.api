name: Deploy API via cPanel HTTPS
on:
  push:
    branches: [main]
    paths: ["web/**", "tools/deploy_cpanel_https.py", ".github/workflows/deploy-cpanel.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-https
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: find web -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Genereer docs-login veilig op de runner
        env:
          AALERTS_DOCS_USERNAME: ${{ secrets.AALERTS_DOCS_USERNAME }}
          AALERTS_DOCS_PASSWORD: ${{ secrets.AALERTS_DOCS_PASSWORD }}
        run: |
          set -euo pipefail
          php -r '
            $user = getenv("AALERTS_DOCS_USERNAME") ?: "";
            $password = getenv("AALERTS_DOCS_PASSWORD") ?: "";
            if (!preg_match("/^[A-Za-z0-9._@-]{3,100}$/", $user) || strlen($password) < 8) {
              fwrite(STDERR, "Docs credentials not configured; skipping hash generation.\n");
              exit(0);
            }
            $hash = password_hash($password, PASSWORD_DEFAULT);
            $config = "<?php\ndeclare(strict_types=1);\nreturn " . var_export(["username"=>$user,"password_hash"=>$hash], true) . ";\n";
            file_put_contents("web/_core/docs-auth.local.php", $config);
            chmod("web/_core/docs-auth.local.php", 0600);
            echo "Docs hash generated in Actions runner; never committed.\n";
          '
      - name: Upload via cPanel API HTTPS
        env:
          VIMEXX_CPANEL_API_TOKEN: ${{ secrets.VIMEXX_CPANEL_API_TOKEN }}
          VIMEXX_CPANEL_USERNAME: ${{ secrets.VIMEXX_CPANEL_USERNAME }}
        run: python3 tools/deploy_cpanel_https.py
      - name: Verify API authentication
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 https://api.a-alerts.nl/v1/meldingen)
          test "$code" = 200 && echo "PASS: public meldingen route answers like the Worker" || { echo "FAIL: API HTTP $code"; exit 1; }
      - name: Verify private docs login and secret file isolation
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://api.a-alerts.nl/docs/ -o /tmp/aalerts-docs-login.html
          grep -q 'name="username"' /tmp/aalerts-docs-login.html
          grep -q 'name="password"' /tmp/aalerts-docs-login.html
          echo "PASS: docs login page available"
          secret_status=$(curl -sS -o /tmp/aalerts-protected.txt -w "%{http_code}" --max-time 20 https://api.a-alerts.nl/_core/docs-auth.local.php)
          case "$secret_status" in
            403|404|503) ;;
            *) echo "FAIL: protected config returned HTTP $secret_status"; exit 1 ;;
          esac
          if grep -qE 'password_hash|\$2y\$|AALERTS_DOCS_PASSWORD' /tmp/aalerts-protected.txt; then
            echo "FAIL: private credential file content leaked"; exit 1
          fi
          echo "PASS: docs private hash file did not expose credential material (HTTP $secret_status)"

