name: Deploy API via cPanel HTTPS
on:
  push:
    branches: [main]
    paths: ["web/**", "tools/deploy_cpanel_https.py", ".github/workflows/deploy-cpanel.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-https
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: find web -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Upload via cPanel API HTTPS
        env:
          VIMEXX_CPANEL_API_TOKEN: ${{ secrets.VIMEXX_CPANEL_API_TOKEN }}
          VIMEXX_CPANEL_USERNAME: ${{ secrets.VIMEXX_CPANEL_USERNAME }}
        run: python3 tools/deploy_cpanel_https.py
      - name: Verify API authentication
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 https://api.a-alerts.nl/v1/meldingen)
          test "$code" = 401 && echo "PASS: private API refuses anonymous access" || { echo "FAIL: API HTTP $code"; exit 1; }
