name: API-gateway (api.a-alerts.nl)
on:
  push:
    branches: [main]
    paths: ["web/**", "test/**", "tools/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Testen (gateway tegen een nagemaakte API)
        run: bash test/run.sh
  deploy:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Secrets controleren
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          for k in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do [ -n "${!k:-}" ] || missing="$missing $k"; done
          if [ -n "$missing" ]; then echo "::warning::Secrets ontbreken:$missing. Niets geüpload."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - name: lftp installeren
        if: steps.check.outputs.skip != '1'
        run: (sudo apt-get update -qq && sudo apt-get install -y -qq lftp) >/dev/null 2>&1 || { echo "lftp via apt mislukt, nu via Homebrew"; B=/home/linuxbrew/.linuxbrew/bin/brew; [ -x "$B" ] && HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 "$B" install lftp >/dev/null 2>&1 && echo "$($B --prefix)/bin" >> "$GITHUB_PATH" && export PATH="$($B --prefix)/bin:$PATH"; }; command -v lftp >/dev/null
      - name: Uploaden via FTP
        if: steps.check.outputs.skip != '1'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          source tools/ftp.sh
          ftp_connect
          T="$FTP_TARGET"
          [ "$T" != "." ] && { ftp_run "mkdir -p -f \"$T\"" >/dev/null 2>&1 || true; }
          # Safety: never upload into the folder of the website a-alerts.nl (that would replace its .htaccess and index).
          ftp_try "cd \"$T\"; cls -1" > "$FTP_TMP/doel.txt" 2>/dev/null || true
          if grep -qxE '(pager|meldkamer|nieuws|assets|widget)/?' "$FTP_TMP/doel.txt"; then
            rm -f "$FTP_TMP/doel.txt"
            echo "::error::De doelmap is de map van de website a-alerts.nl, niet die van api.a-alerts.nl. Niets geüpload. Zet het secret FTP_DIR op de map van het subdomein api.a-alerts.nl."
            exit 1
          fi
          rm -f "$FTP_TMP/doel.txt"
          ftp_run "mirror -R --parallel=2 --exclude-glob .DS_Store ./web/ \"$T\"" >/dev/null 2>&1 \
            || { echo "::error::Uploaden naar de FTP-server mislukt."; exit 1; }
          echo "::notice::Gateway geüpload."
      - name: Live gateway en API controleren
        if: steps.check.outputs.skip != '1' && success()
        run: |
          set -euo pipefail
          sleep 4
          curl -fsSL --max-time 20 https://api.a-alerts.nl/_gateway -o /tmp/a-alerts-gateway.json
          curl -fsSL --max-time 30 https://api.a-alerts.nl/health -o /tmp/a-alerts-health.json
          curl -fsSL --max-time 30 'https://api.a-alerts.nl/v1/meldingen?limit=1' -o /tmp/a-alerts-meldingen.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          gateway=json.loads(Path('/tmp/a-alerts-gateway.json').read_text())
          health=json.loads(Path('/tmp/a-alerts-health.json').read_text())
          alerts=json.loads(Path('/tmp/a-alerts-meldingen.json').read_text())
          assert gateway.get('gateway')=='a-alerts' and gateway.get('actief') is True, 'Gateway is niet actief'
          assert health.get('ok') is True, 'Cloudflare upstream niet bereikbaar'
          assert isinstance(alerts,(dict,list)), 'API meldingen is geen JSON-object'
          print("PASS: api.a-alerts.nl actief; upstream health OK")
          print("P2000/Koyeb ontvangst:", json.dumps({k:health.get(k) for k in ('feed','koyeb')},ensure_ascii=False))
          PY
