name: API gateway regressietests (geen FTPS)
on:
  push:
    branches: [main]
    paths: ["web/**", "test/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find web -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Bestaande gateway regressietests
        run: bash test/run.sh
# Deployment of api.a-alerts.nl uses deploy-cpanel.yml via HTTPS only.
# Old FTPS deployment was retired to prevent concurrent conflicting uploads.
