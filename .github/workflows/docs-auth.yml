name: Docs login configureren (HTTPS cPanel)
on:
  push:
    branches: [main]
    paths: ["tools/cpanel_docs_auth.py", "tools/docs_login_e2e.py", ".github/workflows/docs-auth.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Configureer account buiten de webmap
        env:
          VIMEXX_CPANEL_USERNAME: ${{ secrets.VIMEXX_CPANEL_USERNAME }}
          VIMEXX_CPANEL_API_TOKEN: ${{ secrets.VIMEXX_CPANEL_API_TOKEN }}
          AALERTS_DOCS_USERNAME: ${{ secrets.AALERTS_DOCS_USERNAME }}
          AALERTS_DOCS_PASSWORD: ${{ secrets.AALERTS_DOCS_PASSWORD }}
        run: python3 tools/cpanel_docs_auth.py
      - name: End-to-end login controleren
        env:
          AALERTS_DOCS_USERNAME: ${{ secrets.AALERTS_DOCS_USERNAME }}
          AALERTS_DOCS_PASSWORD: ${{ secrets.AALERTS_DOCS_PASSWORD }}
        run: python3 tools/docs_login_e2e.py
