name: Schermafbeeldingen /docs (na inloggen)
on:
  workflow_dispatch:
    inputs:
      route: { description: "Optioneel: route-sleutel, bv. GET%20%2Fv1%2Fwaarschuwingen", required: false, default: "" }
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright==1.48.0 && python3 -m playwright install --with-deps chromium >/dev/null
      - env:
          AALERTS_DOCS_USERNAME: ${{ secrets.AALERTS_DOCS_USERNAME }}
          AALERTS_DOCS_PASSWORD: ${{ secrets.AALERTS_DOCS_PASSWORD }}
          DOCS_ROUTE: ${{ inputs.route }}
        run: python3 tools/docs_screenshot.py
      - name: Zet de schermafbeeldingen op de branch docs-shots (alleen beelden, overschreven per run)
        run: |
          cd shots
          git init -q -b docs-shots
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Schermafbeeldingen /docs"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" docs-shots
