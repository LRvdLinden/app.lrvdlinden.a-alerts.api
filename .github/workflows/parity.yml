name: Vergelijk Worker en api.a-alerts.nl (alleen lezen)
on:
  push:
    branches: [main]
    paths: ["tools/parity_check.py", ".github/workflows/parity.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/parity_check.py
