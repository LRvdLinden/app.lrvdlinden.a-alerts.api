name: Herstel A-Alerts privéconfiguratie naar aparte map
on:
  push:
    branches: [main]
    paths: ["tools/cpanel_repair_private_paths.py", ".github/workflows/repair-private-paths.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  move:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verplaats alleen drie misplaatste private configuratiebestanden
        env:
          VIMEXX_CPANEL_USERNAME: ${{ secrets.VIMEXX_CPANEL_USERNAME }}
          VIMEXX_CPANEL_API_TOKEN: ${{ secrets.VIMEXX_CPANEL_API_TOKEN }}
        run: python3 tools/cpanel_repair_private_paths.py
