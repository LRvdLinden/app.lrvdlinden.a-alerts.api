name: Vergelijken (gateway en API)
on:
  workflow_dispatch:
    inputs:
      alleen: { description: "Alleen tests met dit woord in de naam", required: false, default: "" }
permissions: { contents: read }
jobs:
  vergelijk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -c "import requests" 2>/dev/null || pip install -q requests
      - run: python3 test/vergelijk.py
        env:
          ALLEEN: ${{ inputs.alleen }}
